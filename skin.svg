<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-label="Inclusive skin AI: a pipeline that captures, labels, trains and serves skin tone and skin condition models built for melanin-rich skin first.">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B1C"/>
      <stop offset="100%" stop-color="#2A1A12"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <marker id="sarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F59E0B"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 5 6; animation: sf 10s linear infinite; }
      @keyframes sf { to { stroke-dashoffset: -110; } }
      .tone { animation: tp 6s ease-in-out infinite; }
      @keyframes tp { 0%, 100% { opacity: 1; } 50% { opacity: 0.82; } }
      @media (prefers-reduced-motion: reduce) { .flow, .tone { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#sbg)"/>

  <text x="48" y="54" class="mono" font-size="12" fill="#F59E0B" letter-spacing="3">INCLUSIVE SKIN AI</text>
  <text x="48" y="84" class="sans" font-size="22" font-weight="700" fill="#FFFFFF">Skin AI built for melanin-rich skin first, not as an afterthought.</text>
  <text x="48" y="110" class="sans" font-size="14" fill="#CBD5E1">Most skin analysis models learn from lighter skin and misread darker tones. This pipeline starts from the other end.</text>

  <!-- Skin tone scale -->
  <text x="48" y="150" class="mono" font-size="11" fill="#94A3B8" letter-spacing="2">MONK SKIN TONE SCALE</text>
  <g class="tone" stroke="#FFFFFF" stroke-opacity="0.18">
    <rect x="48"  y="162" width="110" height="18" rx="4" fill="#F6EDE4"/>
    <rect x="160" y="162" width="110" height="18" rx="4" fill="#F3E7DB"/>
    <rect x="272" y="162" width="110" height="18" rx="4" fill="#F7EAD0"/>
    <rect x="384" y="162" width="110" height="18" rx="4" fill="#EADABA"/>
    <rect x="496" y="162" width="110" height="18" rx="4" fill="#D7BD96"/>
    <rect x="608" y="162" width="110" height="18" rx="4" fill="#A07E56"/>
    <rect x="720" y="162" width="110" height="18" rx="4" fill="#825C43"/>
    <rect x="832" y="162" width="110" height="18" rx="4" fill="#604134"/>
    <rect x="944" y="162" width="110" height="18" rx="4" fill="#3A312A"/>
    <rect x="1056" y="162" width="96" height="18" rx="4" fill="#292420"/>
  </g>

  <!-- Pipeline -->
  <text x="48" y="222" class="mono" font-size="11" fill="#94A3B8" letter-spacing="2">PIPELINE</text>
  <g class="sans" text-anchor="middle">
    <g transform="translate(48,236)">
      <rect width="196" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="98" y="36" font-size="15" font-weight="700" fill="#FFFFFF">Capture</text>
      <text x="98" y="60" font-size="12" fill="#CBD5E1">Phone photos through</text>
      <text x="98" y="77" font-size="12" fill="#CBD5E1">a web app and upload API</text>
    </g>
    <g transform="translate(282,236)">
      <rect width="196" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="98" y="36" font-size="15" font-weight="700" fill="#FFFFFF">Label</text>
      <text x="98" y="60" font-size="12" fill="#CBD5E1">Labeling of skin tone</text>
      <text x="98" y="77" font-size="12" fill="#CBD5E1">and condition in Label Studio</text>
    </g>
    <g transform="translate(516,236)">
      <rect width="196" height="96" rx="14" fill="url(#core)"/>
      <text x="98" y="36" font-size="15" font-weight="700" fill="#FFFFFF">Train</text>
      <text x="98" y="60" font-size="12" fill="#FDE7C7">PyTorch skin tone and</text>
      <text x="98" y="77" font-size="12" fill="#FDE7C7">skin condition models</text>
    </g>
    <g transform="translate(750,236)">
      <rect width="196" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="98" y="36" font-size="15" font-weight="700" fill="#FFFFFF">Serve</text>
      <text x="98" y="60" font-size="12" fill="#CBD5E1">Inference API with a</text>
      <text x="98" y="77" font-size="12" fill="#CBD5E1">Vertex AI endpoint</text>
    </g>
    <g transform="translate(984,236)">
      <rect width="168" height="96" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-opacity="0.45"/>
      <text x="84" y="36" font-size="15" font-weight="700" fill="#FFFFFF">Advise</text>
      <text x="84" y="60" font-size="12" fill="#CBD5E1">Personalized skincare</text>
      <text x="84" y="77" font-size="12" fill="#CBD5E1">for the person's tone</text>
    </g>
  </g>
  <g stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#sarr)">
    <path class="flow" d="M246 284 L278 284"/>
    <path class="flow" d="M480 284 L512 284"/>
    <path class="flow" d="M714 284 L746 284"/>
    <path class="flow" d="M948 284 L980 284"/>
  </g>

  <!-- Foundations -->
  <text x="48" y="374" class="mono" font-size="11" fill="#94A3B8" letter-spacing="2">FOUNDATIONS</text>
  <g class="mono" font-size="12" fill="#FDE7C7" text-anchor="middle">
    <g transform="translate(48,386)"><rect width="250" height="30" rx="15" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.35"/><text x="125" y="20">Python model libraries</text></g>
    <g transform="translate(312,386)"><rect width="250" height="30" rx="15" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.35"/><text x="125" y="20">Next.js product surfaces</text></g>
    <g transform="translate(576,386)"><rect width="270" height="30" rx="15" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.35"/><text x="135" y="20">GPU training on Azure, Terraform</text></g>
    <g transform="translate(860,386)"><rect width="292" height="30" rx="15" fill="#F59E0B" fill-opacity="0.10" stroke="#F59E0B" stroke-opacity="0.35"/><text x="146" y="20">CI/CD to containers on every push</text></g>
  </g>
</svg>
