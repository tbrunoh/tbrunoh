<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="ACE architecture: eight entry points share one identity and memory; the engine runs safety, intent, context and grounded answers over context packs; mobile money turns guidance into transactions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B1C"/>
      <stop offset="100%" stop-color="#0B2A3F"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2DD4BF"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 5 6; animation: f 10s linear infinite; }
      @keyframes f { to { stroke-dashoffset: -110; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="470" rx="18" fill="url(#bg)"/>

  <text x="48" y="54" class="mono" font-size="12" fill="#2DD4BF" letter-spacing="3">ACE ARCHITECTURE</text>
  <text x="48" y="84" class="sans" font-size="22" font-weight="700" fill="#FFFFFF">Eight ways in. One identity, one memory, one context engine.</text>

  <text x="48" y="126" class="mono" font-size="11" fill="#94A3B8" letter-spacing="2">ENTRY POINTS</text>
  <g class="sans" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <g transform="translate(48,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">Voice call</text></g>
    <g transform="translate(187,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">USSD</text></g>
    <g transform="translate(326,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">SMS</text></g>
    <g transform="translate(465,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">WhatsApp</text></g>
    <g transform="translate(604,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">Smartphone</text></g>
    <g transform="translate(743,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">Trusted agent</text></g>
    <g transform="translate(882,138)"><rect width="128" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.45"/><text x="64" y="27">Radio</text></g>
    <g transform="translate(1021,138)"><rect width="131" height="44" rx="22" fill="#2DD4BF" fill-opacity="0.14" stroke="#2DD4BF" stroke-opacity="0.8"/><text x="65" y="27">API and MCP</text></g>
  </g>

  <path class="flow" d="M600 188 L600 212" stroke="#2DD4BF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <g transform="translate(48,218)" class="sans">
    <rect width="1104" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="24" y="26" class="mono" font-size="13" fill="#5EEAD4">identity</text>
    <text x="150" y="26" font-size="14" fill="#CBD5E1">One profile keyed to the phone number and wallet. Start on a call, continue on WhatsApp, confirm on USSD.</text>
  </g>

  <path class="flow" d="M600 264 L600 288" stroke="#2DD4BF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <g transform="translate(48,294)" class="sans">
    <rect width="1104" height="70" rx="12" fill="url(#engine)"/>
    <text x="24" y="30" font-size="17" font-weight="700" fill="#FFFFFF">Engine</text>
    <text x="24" y="52" font-size="12" fill="#CCFBF1">Grounded or silent</text>
    <g font-size="14" font-weight="600" fill="#FFFFFF">
      <rect x="190" y="17" width="190" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.12"/><text x="285" y="40" text-anchor="middle">1  Safety rail</text>
      <rect x="400" y="17" width="190" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.12"/><text x="495" y="40" text-anchor="middle">2  Intent</text>
      <rect x="610" y="17" width="210" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.12"/><text x="715" y="40" text-anchor="middle">3  Hyperlocal context</text>
      <rect x="840" y="17" width="240" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.12"/><text x="960" y="40" text-anchor="middle">4  Answer with citations</text>
    </g>
  </g>

  <path class="flow" d="M330 370 L330 392" stroke="#2DD4BF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path class="flow" d="M870 370 L870 392" stroke="#2DD4BF" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <g class="sans">
    <g transform="translate(48,398)">
      <rect width="544" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="20" y="30" font-size="14" font-weight="700" fill="#FFFFFF">Context packs</text>
      <text x="150" y="30" font-size="13" fill="#CBD5E1">Open tier CC BY 4.0  ·  Verified tier licensed</text>
    </g>
    <g transform="translate(608,398)">
      <rect width="544" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="20" y="30" font-size="14" font-weight="700" fill="#FFFFFF">Mobile money</text>
      <text x="150" y="30" font-size="13" fill="#CBD5E1">M-Pesa, MTN MoMo, Airtel Money, Orange Money</text>
    </g>
  </g>
</svg>
